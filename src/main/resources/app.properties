# Non-secret settings (design doc section 23). Safe to commit.
session.idle.timeout.seconds=300
db.query.timeout.seconds=10
tx.max.amount=1000000.00
auth.max.failed.logins=5
auth.lock.minutes=15
password.hash.algorithm=PBKDF2WithHmacSHA256
password.hash.iterations=600000
history.max.page.size=50
savings.minimum.balance=0.00 
# AI assistant (local Ollama). Set assistant.enabled=false to hide it.
assistant.enabled=true
ollama.url=http://localhost:11434
ollama.model=llama3.2
ollama.timeout.seconds=60